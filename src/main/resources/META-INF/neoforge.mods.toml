[[mods]]
modId="apotheosis_expansion"
version="${file.jarVersion}"
displayName="Apotheosis Expansion"
authors="Tamamo"
description='''
Adds random Apotheosis affixes and gem sockets to items crafted by players,
unlocks selected spawn eggs for mob spawners, tunes gem drop rates, and
adds Apotheosis Invaders for the Thermal Series elementals.

Every feature is independently toggleable from the in-game mod config screen and
takes effect immediately. The Thermal invader entries additionally need a data reload after being toggled.
'''

[[mixins]]
config="apotheosis_expansion.mixins.json"

