modLoader="javafml"
loaderVersion="[2,)"
license="MIT"
issueTrackerURL="https://github.com/Shadows-of-Fire/Apotheosis"

[[mods]]
modId="apotheosis_expansion"
version="${file.jarVersion}"
displayName="Apotheosis Expansion"
authors="Tamamo"
description='''
Adds random Apotheosis affixes and gem sockets to items crafted by players,
unlocks selected spawn eggs for mob spawners, tunes gem drop rates, and
adds Apotheosis Invaders for several other mods' mobs.

Also fixes two player-facing behaviours (respawn health, player-named mobs in
Peaceful), and adds a shared monster budget that lets players on one spawn
platform raise the cap together - optionally across world tiers, with fake
players inheriting their summoner's tier.

Almost every option applies as soon as it is saved; only the invader switches
need a data reload.
'''

[[mixins]]
config="apotheosis_expansion.mixins.json"

# HUD compatibility patches live in their own config so a missing MiniHUD / Servux can never fail the main one.
# The config is "required": false and CompatMixinPlugin checks the mod list before any mixin is resolved.
[[mixins]]
config="apotheosis_expansion.compat.mixins.json"

[[dependencies.apotheosis_expansion]]
modId="neoforge"
type="required"
versionRange="[21.1.235,)"
ordering="NONE"
side="BOTH"

[[dependencies.apotheosis_expansion]]
modId="minecraft"
type="required"
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.apotheosis_expansion]]
modId="apotheosis"
type="required"
versionRange="[8.9.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.apotheosis_expansion]]
modId="placebo"
type="required"
versionRange="[9.9.2,)"
ordering="AFTER"
side="BOTH"

# Optional: the spawner-rune tooltip feature is derived from this mod's spawner_modifier recipe type. Declared as
# "optional" so a pack that runs Apotheosis without the spawner module still loads - the feature then simply reports
# itself as unavailable instead of the whole mod being refused.
[[dependencies.apotheosis_expansion]]
modId="apothic_spawners"
type="optional"
versionRange="[1.4.0,)"
ordering="AFTER"
side="BOTH"

# Optional: the Mekanism: Tools integration adds affix loot entries, salvaging recipes and invader gear sets for its
# material equipment. Declared even though nothing here needs the classes at compile time, because it is what makes
# the relationship visible in the mod list and in launcher dependency views.
[[dependencies.apotheosis_expansion]]
modId="mekanismtools"
type="optional"
versionRange="[10.7.0,)"
ordering="AFTER"
side="BOTH"

# Optional: the energy-gear block pins Mekanism's MekaSuit / MekaTool / atomic disassembler etc. to apotheosis:none, so
# the [crafting] feature stops attaching durability-scaled affixes to gear that runs on energy and has no durability.
[[dependencies.apotheosis_expansion]]
modId="mekanism"
type="optional"
versionRange="[10.7.0,)"
ordering="AFTER"
side="BOTH"
