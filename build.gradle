plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.properties.modVersion
group = 'com.tamamo.apotheosisexpansion'

base {
    archivesName = "ApotheosisExpansion-${mcVersion}-neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion as int)
    }
}

repositories {
    mavenCentral()

    // Shadow's Maven hosts the whole Apotheosis family and is the canonical source:
    // https://maven.shadowsoffire.dev/releases/dev/shadowsoffire/<Artifact>/<mc>-<version>/
    //
    // Resolving from here (rather than a local flatDir) is what makes a fresh clone buildable
    // without any manually supplied jars.
    maven {
        name = 'shadowsoffire'
        url = 'https://maven.shadowsoffire.dev/releases'
        content {
            includeGroup 'dev.shadowsoffire'
        }
    }
}

neoForge {
    version = project.properties.neoforgeVersion

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        apotheosis_expansion {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Compile-only against the Apotheosis stack: the real mods provide these at runtime, and
    // bundling them would be wrong (they are separate distributions).
    compileOnly "dev.shadowsoffire:Apotheosis:${mcVersion}-${apotheosisVersion}"
    compileOnly "dev.shadowsoffire:Placebo:${mcVersion}-${placeboVersion}"
    compileOnly "dev.shadowsoffire:ApothicAttributes:${mcVersion}-${apothicAttributesVersion}"
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : 'apotheosis_expansion',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.version
        ])
    }
}
