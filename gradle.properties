# Compile-only view of the recipe-viewer APIs, for the gem compendium. Both pins are the
# generations this machine's cache already holds; every method used was confirmed present in
# jei 19.44.0.401 / emi 1.1.22, so the result runs on anything from that generation up.
jeiVersion=19.44.0.401
emiVersion=1.1.22+1.21.1
